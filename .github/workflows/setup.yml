name: Set up workspace
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create workspace labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/setup_labels.py
