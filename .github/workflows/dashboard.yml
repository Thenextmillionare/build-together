name: Refresh dashboard
on:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled, deleted, transferred]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '23 16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/dashboard.py', '.github/workflows/dashboard.yml']
permissions:
  contents: write
  issues: read
concurrency:
  group: dashboard
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Generate snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dashboard.py
      - name: Publish snapshot
        run: |
          cat DASHBOARD.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DASHBOARD.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh progress dashboard'
          git pull --rebase origin main
          git push origin HEAD:main
