name: Workspace checks
on:
  push:
    paths: ['scripts/**', 'tests/**', '.github/**']
  pull_request:
    paths: ['scripts/**', 'tests/**', '.github/**']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
